name: CI

on:
  pull_request:
  push:
    branches: [master]

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Corepack downloads the pnpm version from package.json without asking.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  ci:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # The store only changes when the lockfile does, so the lockfile hash is the key.
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache entries are immutable, so every commit saves a new one and
      # restores the newest previous entry through restore-keys.
      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The same build as a zip, ready for "Load unpacked" (unzipped) or the Web Store.
      - name: Zip the Chrome extension
        run: pnpm --filter @agenda/extension zip

      - name: Upload the extension
        uses: actions/upload-artifact@v7
        with:
          name: agenda-chrome-extension
          path: apps/extension/.output/agenda-chrome-*.zip
          # WXT writes to .output/, and upload-artifact skips dot-folders unless told.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: End-to-end (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browsers only change with the Playwright version, which the lockfile pins.
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @agenda/e2e exec playwright install --with-deps chromium

      # A cached browser still needs its system libraries.
      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @agenda/e2e exec playwright install-deps chromium

      - name: Build
        run: pnpm build

      # Starts its own API (temp database, port 4101) and `vite preview` (port 5101); the
      # extension spec loads the built extension in Chromium against the same API.
      - name: Run the smoke tests
        run: pnpm e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  desktop:
    name: Desktop (Rust checks, Windows installer)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The runner has rustup; this installs the version rust-toolchain.toml pins, with
      # rustfmt and clippy, so every machine gets the same lints.
      - name: Install the pinned Rust toolchain
        working-directory: apps/desktop/src-tauri
        run: rustup toolchain install

      # Crates only change with Cargo.lock; the build output is kept with them.
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # tauri-build embeds the web app at compile time, so even clippy needs dist/.
      - name: Build the web app
        run: pnpm exec turbo run build --filter=@agenda/web

      - name: Rust format and lint (cargo fmt, clippy -D warnings)
        run: pnpm --filter @agenda/desktop rust:check

      - name: Rust tests
        run: pnpm --filter @agenda/desktop rust:test

      - name: Build the Windows installer (NSIS)
        run: pnpm desktop:installer

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: agenda-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
